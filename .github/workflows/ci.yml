# CI — 착수 조건 C5(iter 8 · L1 · 보안 재심) 및 §6.2 공통 게이트.
#
# 락파일 없이 도는 CI 경로가 있으면 안 되므로(B2), 이 워크플로가 이 저장소의 유일한 CI 경로이고
# 유일한 install 단계는 항상 --frozen-lockfile을 쓴다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      # Node 22.13은 pnpm 11.4.0의 최소 요구 버전이다(pnpm이 `node:sqlite`를 쓴다).
      # 여기를 20으로 두는 동안 CI 5회가 전부 이 단계에서 죽었고 — `cache: pnpm`이
      # `pnpm store path`를 호출한다 — 아래 게이트는 한 번도 실행되지 않았다.
      # engines.node의 하한과 같은 값을 쓴다: 선언한 하한이 실제로 도는지 CI가 검증한다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      # B2 — 락파일과 매니페스트가 어긋나면 여기서 실패한다. 이 워크플로 전체에서 install은
      # 이 한 곳뿐이므로 "락파일 없이 도는 CI 경로 0건"이 구조적으로 보장된다.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 계층 경계 lint — 동적 import()·I/O 모듈 재노출 우회 회귀 테스트(A1/A2) 포함.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Runtime dependency allowlist
        run: pnpm deps:check

      - name: Public repo hygiene check
        run: pnpm hygiene:check

      # B1 — 공급망 게이트. High/Critical 0건이어야 통과한다(그 아래 등급은 게이트 대상이 아니다).
      - name: Supply-chain audit (prod deps, High/Critical only)
        run: pnpm audit --prod --audit-level=high

      # B3 — "런타임 의존성 0개 유지" 방향을 검증 가능한 형태로 고정한다.
      - name: Assert zero runtime dependencies
        run: pnpm ls -r --prod --json | node scripts/assert-zero-runtime-deps.mjs

      # R15 — managed 정책 탐지가 **조회 경로에 배선돼 있는지**를 지킨다. 러너에는 managed
      # 정책이 없으므로 여기서의 통과는 "이 러너가 깨끗하다"일 뿐 개발자 머신에 대한 판정이
      # 아니다 — 이 스텝의 값어치는 배선 회귀를 막는 것이다(탐지기는 있는데 doctor에 안 붙어
      # 있던 것이 이번에 발견됐다). 실제 강제는 gen의 자체 게이트가 한다.
      - name: Managed policy detection wiring (R15)
        run: pnpm gate:managed-policy

      # B1 Step 2 — `AssetKind`를 소비하는 지점이 새 값에 컴파일 에러를 내는지 지킨다.
      # ⚠️ 이 워크플로는 `pnpm verify`를 부르지 않고 스텝을 개별 나열한다. 그래서 `verify`
      # 체인에 등록하는 것만으로는 CI에서 **한 번도 돌지 않는다**(등재 ≠ 도달). 로컬에서도
      # `&&` 체인이라 앞 단계의 상시 실패가 뒤를 막는다 — 게이트를 새로 만들면 `verify`와
      # **이 파일 양쪽에** 넣고, CI 로그에 그 출력이 실제로 찍히는지 눈으로 확인한다.
      - name: AssetKind exhaustiveness gate (B1)
        run: pnpm gate:asset-kind
